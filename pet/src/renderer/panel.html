<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
    <title>大肥鱼 · 状态</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 14px;
        background: transparent;
        font: 14px/1.5 "Microsoft YaHei", "PingFang SC", sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      #panel {
        background: #ffffff;
        border-radius: 14px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.22);
        overflow: hidden;
        color: #1f2937;
      }
      #header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        background: #2563eb;
        color: #ffffff;
        font-weight: 600;
      }
      #close {
        border: none;
        background: rgba(255, 255, 255, 0.2);
        color: #ffffff;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
      }
      section {
        padding: 12px 14px;
      }
      section + section {
        border-top: 1px solid #e5e7eb;
      }
      h3 {
        margin: 0 0 6px;
        font-size: 13px;
        color: #6b7280;
        font-weight: 600;
      }
      ul {
        margin: 6px 0 0;
        padding-left: 18px;
      }
      li {
        margin: 3px 0;
      }
      .dim {
        color: #6b7280;
        font-size: 12px;
      }
      b {
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <div id="header">
        <span>大肥鱼 · 状态</span>
        <button id="close" title="关闭">×</button>
      </div>
      <section>
        <h3>校园信息</h3>
        <div id="campus">加载中…</div>
      </section>
      <section>
        <h3>DeepSeek 余额</h3>
        <div id="deepseek">加载中…</div>
      </section>
    </div>
    <script src="panel.js"></script>
  </body>
</html>

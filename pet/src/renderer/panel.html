<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
    <title>大肥鱼 · 状态</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 12px;
        height: 100%;
        box-sizing: border-box;
        background: transparent;
        font: 14px/1.5 "Microsoft YaHei", "PingFang SC", sans-serif;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
      }
      #panel {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: #ffffff;
        border-radius: 14px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.22);
        overflow: hidden;
        color: #1f2937;
      }
      #header {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        background: #2563eb;
        color: #ffffff;
        font-weight: 600;
        cursor: move;
      }
      #close {
        border: none;
        background: rgba(255, 255, 255, 0.2);
        color: #ffffff;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
      }
      #scroll {
        flex: 1;
        overflow-y: auto;
      }
      /* 去掉右侧滑动条，仍可用滚轮滚动 */
      #scroll::-webkit-scrollbar {
        display: none;
      }
      section {
        padding: 12px 14px;
      }
      section + section {
        border-top: 1px solid #e5e7eb;
      }
      h3 {
        margin: 0 0 6px;
        font-size: 13px;
        color: #6b7280;
        font-weight: 600;
      }
      ul {
        margin: 6px 0 0;
        padding-left: 18px;
      }
      li {
        margin: 3px 0;
      }
      .dim {
        color: #6b7280;
        font-size: 12px;
      }
      b {
        color: #2563eb;
      }
      #grip {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 26px;
        height: 26px;
        cursor: nwse-resize;
        z-index: 20;
      }
      #grip::after {
        content: '';
        position: absolute;
        right: 6px;
        bottom: 6px;
        width: 10px;
        height: 10px;
        border-right: 2.5px solid #9ca3af;
        border-bottom: 2.5px solid #9ca3af;
      }
      #grip:hover::after {
        border-color: #2563eb;
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <div id="header">
        <span>大肥鱼 · 状态</span>
        <button id="close" title="关闭">×</button>
      </div>
      <div id="scroll">
        <section>
          <h3>今日课程</h3>
          <div id="campus">加载中…</div>
        </section>
        <section>
          <h3>Canvas 任务</h3>
          <div id="canvas">加载中…</div>
        </section>
        <section>
          <h3>DeepSeek</h3>
          <div id="deepseek">加载中…</div>
        </section>
      </div>
      <div id="grip" title="拖动缩放"></div>
    </div>
    <script src="panel.js"></script>
  </body>
</html>

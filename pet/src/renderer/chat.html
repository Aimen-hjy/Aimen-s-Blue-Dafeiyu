<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'" />
    <title>大肥鱼 · 对话</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 12px;
        height: 100%;
        box-sizing: border-box;
        background: transparent;
        font: 14px/1.5 "Microsoft YaHei", "PingFang SC", sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      #chat {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: #ffffff;
        border-radius: 14px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.22);
        overflow: hidden;
        color: #1f2937;
      }
      #header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        padding: 10px 12px;
        background: #2563eb;
        color: #ffffff;
        font-weight: 600;
        cursor: move;
      }
      #header .title {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #header .actions {
        display: flex;
        gap: 4px;
        flex-shrink: 0;
      }
      #header button {
        border: none;
        background: rgba(255, 255, 255, 0.2);
        color: #ffffff;
        height: 22px;
        padding: 0 8px;
        border-radius: 11px;
        cursor: pointer;
        font-size: 12px;
        line-height: 1;
      }
      #header button:hover {
        background: rgba(255, 255, 255, 0.35);
      }
      #close {
        width: 22px !important;
        padding: 0 !important;
        font-size: 14px !important;
      }
      #hint {
        padding: 6px 12px;
        background: #eff6ff;
        color: #2563eb;
        font-size: 12px;
        border-top: 1px solid #dbeafe;
        display: none;
      }
      #hint.on {
        display: block;
      }
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        user-select: text;
        -webkit-user-select: text;
      }
      .msg {
        max-width: 85%;
        margin-bottom: 10px;
        padding: 8px 11px;
        border-radius: 12px;
        word-break: break-word;
        white-space: pre-wrap;
        clear: both;
      }
      .msg.bot {
        background: #f3f4f6;
        float: left;
        border-bottom-left-radius: 4px;
      }
      .msg.user {
        background: #2563eb;
        color: #ffffff;
        float: right;
        border-bottom-right-radius: 4px;
      }
      .msg .shot {
        display: block;
        max-width: 100%;
        border-radius: 8px;
        margin-bottom: 6px;
      }
      #input-row {
        display: flex;
        gap: 6px;
        padding: 10px 34px 10px 12px;
        border-top: 1px solid #e5e7eb;
      }
      #input {
        flex: 1;
        border: 1px solid #d1d5db;
        border-radius: 18px;
        padding: 7px 13px;
        font: 14px/1.4 "Microsoft YaHei", sans-serif;
        outline: none;
        user-select: text;
        -webkit-user-select: text;
      }
      #input:focus {
        border-color: #2563eb;
      }
      #send {
        border: none;
        background: #2563eb;
        color: #ffffff;
        border-radius: 18px;
        padding: 0 16px;
        cursor: pointer;
        font-size: 14px;
      }
      #send:disabled {
        background: #9ca3af;
        cursor: default;
      }
      #grip {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 20px;
        height: 20px;
        cursor: nwse-resize;
        z-index: 10;
      }
      #grip::after {
        content: '';
        position: absolute;
        right: 4px;
        bottom: 4px;
        width: 8px;
        height: 8px;
        border-right: 2px solid #cbd5e1;
        border-bottom: 2px solid #cbd5e1;
      }
    </style>
  </head>
  <body>
    <div id="chat">
      <div id="header">
        <span class="title">大肥鱼 · 和 DSH 聊天</span>
        <div class="actions">
          <button id="open-dsh" title="打开完整 DSH Web UI">🚀 DSH</button>
          <button id="shot" title="截屏当前屏幕并提问">📸 截屏</button>
          <button id="close" title="关闭">×</button>
        </div>
      </div>
      <div id="hint"></div>
      <div id="messages"></div>
      <div id="input-row">
        <input id="input" type="text" placeholder="问点什么…（Enter 发送）" />
        <button id="send">发送</button>
      </div>
      <div id="grip" title="拖动缩放"></div>
    </div>
    <script src="chat.js"></script>
  </body>
</html>
